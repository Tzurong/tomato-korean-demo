<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蕃茄韓文 — 網頁版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tomato:#e1502f; --tomato-mid:#d6402c; --tomato-deep:#a62e1f;
    --vine:#5a8a5f; --vine-deep:#3e6b44;
    --cream:#fbf4e9; --crate:#efdfc0; --ink:#2b2118; --ink-soft:#6b5d4f;
    --gold:#e8a93b;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); font-family:'Noto Sans TC', sans-serif; color:var(--ink);}

  /* ===== 頂部導覽列 ===== */
  header{
    background:#fff; border-bottom:1px solid #f0e5d2;
    padding:14px 40px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100;
  }
  .logo{display:flex; align-items:center; gap:10px;}
  .logo svg{width:32px; height:32px;}
  .logo span{font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:var(--tomato-deep);}
  nav{display:flex; gap:28px;}
  nav a{color:var(--ink-soft); text-decoration:none; font-weight:600; font-size:14.5px; cursor:pointer;}
  nav a.active{color:var(--tomato);}
  .signup-btn{background:var(--tomato); color:#fff; padding:9px 20px; border-radius:20px; font-weight:700; font-size:13.5px; border:none; cursor:pointer;}

  /* ===== 主要內容區 ===== */
  main{max-width:1100px; margin:0 auto; padding:40px;}

  .page-title{font-family:'Fraunces',serif; font-size:28px; font-weight:700; margin-bottom:6px;}
  .page-sub{color:var(--ink-soft); font-size:14px; margin-bottom:30px;}

  .player-layout{display:grid; grid-template-columns:1.6fr 1fr; gap:28px;}
  @media(max-width:860px){.player-layout{grid-template-columns:1fr;}}

  .video-panel{background:#000; border-radius:16px; overflow:hidden; aspect-ratio:16/9; position:relative;}
  .video-panel iframe{width:100%; height:100%; border:none;}

  .below-video{margin-top:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .video-info h2{font-family:'Fraunces',serif; font-size:19px; margin:0 0 4px;}
  .video-info p{font-size:13px; color:var(--ink-soft); margin:0;}
  .mode-strip{display:flex; gap:8px;}
  .chip{font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px; background:#f5ede0; color:var(--ink-soft); cursor:pointer;}
  .chip.on{background:var(--tomato); color:#fff;}

  /* ===== 右側字幕面板 ===== */
  .subtitle-panel{
    background:#fff; border-radius:16px; border:1px solid #f0e5d2;
    max-height:560px; overflow-y:auto; padding:8px 0;
  }
  .sline{padding:14px 20px; border-left:3px solid transparent; cursor:pointer;}
  .sline.active{background:#fbefe6; border-left-color:var(--tomato);}
  .sline .ko{font-family:'Noto Sans KR',sans-serif; font-size:16px; font-weight:600; color:var(--ink); margin-bottom:4px;}
  .sline .zh{font-size:13px; color:var(--ink-soft);}

  /* ===== 影片清單區 ===== */
  .section-title{font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin:50px 0 18px;}
  .video-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:18px;}
  .video-card{
    background:#fff; border-radius:14px; overflow:hidden; border:1px solid #f0e5d2;
    cursor:pointer; transition:transform 0.15s ease;
  }
  .video-card:hover{transform:translateY(-3px); box-shadow:0 12px 24px -12px rgba(43,33,24,0.2);}
  .card-thumb{aspect-ratio:16/9; background:linear-gradient(135deg,#f6dcc5,#e8a93b); display:flex; align-items:center; justify-content:center; position:relative;}
  .card-thumb::after{content:'▶'; color:#fff; background:rgba(0,0,0,0.45); width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px;}
  .card-body{padding:14px;}
  .card-body .title{font-size:14px; font-weight:700; line-height:1.4; margin-bottom:6px;}
  .card-body .meta{font-size:12px; color:var(--ink-soft);}

  footer{text-align:center; padding:40px; color:var(--ink-soft); font-size:12.5px; border-top:1px solid #f0e5d2; margin-top:60px;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 200 200"><path d="M100 55 Q78 40 70 20 Q95 25 100 48 Q105 25 130 20 Q122 40 100 55" fill="#5a8a5f"/><path d="M100 55 C145 55 168 95 163 130 C158 168 133 185 100 185 C67 185 42 168 37 130 C32 95 55 55 100 55 Z" fill="#e1502f"/></svg>
    <span>蕃茄韓文</span>
  </div>
  <nav>
    <a class="active">影片學習</a>
    <a>背單字</a>
    <a>生詞本</a>
    <a>學習進度</a>
  </nav>
  <button class="signup-btn">登入 / 註冊</button>
</header>

<main>
  <div class="page-title">한국 문화 팟캐스트</div>
  <div class="page-sub">Didi의 한국문화 Podcast · 逐句精聽模式</div>

  <div class="player-layout">
    <div>
      <div class="video-panel">
        <iframe src="https://www.youtube-nocookie.com/embed/YVQVTHnw5L8?rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="below-video">
        <div class="video-info">
          <h2>逐句對照精聽</h2>
          <p>點右側任一句字幕，影片會自動跳到該時間點</p>
        </div>
        <div class="mode-strip">
          <div class="chip on">逐句對照</div>
          <div class="chip">精聽 ×1</div>
          <div class="chip">0.75x</div>
        </div>
      </div>
    </div>

    <div class="subtitle-panel" id="subList"></div>
  </div>

  <div class="section-title">📚 精選影片</div>
  <div class="video-grid">
    <div class="video-card">
      <div class="card-thumb"></div>
      <div class="card-body">
        <div class="title">한국어로 다양한 한국 문화에 대해 이야기하는 팟캐스트</div>
        <div class="meta">Didi의 한국문화 Podcast</div>
      </div>
    </div>
    <div class="video-card">
      <div class="card-thumb" style="background:linear-gradient(135deg,#dcebdd,#4c7a57)"></div>
      <div class="card-body">
        <div class="title">서울 브이로그 · 하루 일상 韓語日常</div>
        <div class="meta">일상 Vlog</div>
      </div>
    </div>
    <div class="video-card">
      <div class="card-thumb" style="background:linear-gradient(135deg,#f3d9e0,#d6402c)"></div>
      <div class="card-body">
        <div class="title">뉴스로 배우는 이번 주 한국 소식</div>
        <div class="meta">精選新聞</div>
      </div>
    </div>
  </div>
</main>

<footer>🍅 蕃茄韓文 Tomato Korean — 網頁版原型 Demo</footer>

<script>
const subtitles = [
  {start:0.0, korean:"안녕하세요 한국어로 다양한 한국 문화에 대해 이야기하는 에 오신 여러분 반갑습니다", chinese:"大家好，歡迎來到用韓文聊聊各種韓國文化的節目，很高興見到大家！"},
  {start:6.2, korean:"여러분 저번 한 주도 다들 잘 지내셨나요?", chinese:"大家過去這一週過得還好嗎？"},
  {start:9.4, korean:"오늘은 '한자'에 대해서 이야기를 해보려고 하는데요", chinese:"今天我想跟大家聊聊「漢字」這個話題。"},
  {start:12.18, korean:"여러분들은 한자 뭔지 알고 계신가요?", chinese:"大家知道什麼是漢字嗎？"},
  {start:15.14, korean:"아니면 알고 계신 한자 좀 있나요?", chinese:"還是說，大家有認識哪些漢字嗎？"}
];
const subListEl = document.getElementById('subList');
subtitles.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'sline' + (i === 1 ? ' active' : '');
  div.innerHTML = `<div class="ko">${s.korean}</div><div class="zh">${s.chinese}</div>`;
  div.onclick = () => {
    document.querySelectorAll('.sline').forEach(l => l.classList.remove('active'));
    div.classList.add('active');
    const iframe = document.querySelector('.video-panel iframe');
    iframe.contentWindow.postMessage(JSON.stringify({event:'command', func:'seekTo', args:[s.start, true]}), '*');
  };
  subListEl.appendChild(div);
});
</script>

</body>
</html>
